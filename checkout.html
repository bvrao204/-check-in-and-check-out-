<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-Out - VNR Hostels</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <div class="glass-card" id="mainCard" style="margin: 0 auto;">
                <h2>Hostel Check-Out</h2>
                <p class="subtitle">Complete the checklist to release your room allocation.</p>

                <form id="checkOutForm" onsubmit="return handleCheckOut(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="roomDisplay">Allocated Room</label>
                            <input type="text" id="roomDisplay" readonly style="background: rgba(255, 255, 255, 0.01); color: var(--text-muted);">
                        </div>
                        <div class="form-group">
                            <label for="blockDisplay">Hostel Block</label>
                            <input type="text" id="blockDisplay" readonly style="background: rgba(255, 255, 255, 0.01); color: var(--text-muted);">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="checkOutDate">Check-Out Date</label>
                        <input type="date" id="checkOutDate" required>
                    </div>

                    <h3 style="font-size: 1.1rem; margin: 25px 0 15px 0; color: var(--primary); border-bottom: 1px solid var(--glass-border); padding-bottom: 5px;">
                        Check-Out Requirements
                    </h3>

                    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem;">
                            <input type="checkbox" id="keyReturned" required style="width: 18px; height: 18px; cursor: pointer;">
                            Room keys returned to warden
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem;">
                            <input type="checkbox" id="roomInspected" required style="width: 18px; height: 18px; cursor: pointer;">
                            Room cleanliness & condition inspected
                        </label>
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem;">
                            <input type="checkbox" id="duesCleared" required style="width: 18px; height: 18px; cursor: pointer;">
                            All mess & hostel dues cleared
                        </label>
                    </div>

                    <div class="form-group">
                        <label for="feedback">Your Experience / Feedback</label>
                        <textarea id="feedback" rows="3" placeholder="Tell us how we can improve your stay..."></textarea>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 15px;">
                        <a href="confirmation.html" class="btn btn-secondary" style="width: 40%;">Cancel & Back</a>
                        <button type="submit" class="btn btn-danger" style="width: 60%;">Confirm Check-Out</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getLoggedInUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const active = getUserActiveCheckIn(user.username);
            const card = document.getElementById('mainCard');

            if (!active) {
                card.innerHTML = `
                    <div style="text-align: center; padding: 20px 0;">
                        <span style="font-size: 3.5rem; display: block; margin-bottom: 15px;">⚠️</span>
                        <h2>No Active Accommodation</h2>
                        <p class="subtitle" style="margin-bottom: 30px;">
                            You currently do not have any room check-in registered in our system, so you cannot perform a check-out.
                        </p>
                        <a href="confirmation.html" class="btn btn-primary">Go to Dashboard</a>
                    </div>
                `;
                return;
            }

            // Populate active details
            document.getElementById('roomDisplay').value = `Room ${active.roomNumber}`;
            document.getElementById('blockDisplay').value = active.block;

            // Set default date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('checkOutDate').value = today;
            document.getElementById('checkOutDate').min = active.checkInDate; // Can't checkout before checkin
        });

        function handleCheckOut(e) {
            e.preventDefault();

            const user = getLoggedInUser();
            const keysChecked = document.getElementById('keyReturned').checked;
            const inspectedChecked = document.getElementById('roomInspected').checked;
            const duesChecked = document.getElementById('duesCleared').checked;

            if (!keysChecked || !inspectedChecked || !duesChecked) {
                showToast('Please verify all check-out requirements.', 'danger');
                return false;
            }

            const checkoutDetails = {
                username: user.username,
                checkOutDate: document.getElementById('checkOutDate').value,
                feedback: document.getElementById('feedback').value.trim(),
                keysReturned: true
            };

            const result = checkOutUser(checkoutDetails);

            if (result.success) {
                showToast('Check-Out processed successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'checkout_confirmation.html';
                }, 1200);
            } else {
                showToast(result.message, 'danger');
            }
            return false;
        }
    </script>
</body>
</html>
