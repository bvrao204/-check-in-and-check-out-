<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VNR Hostels</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <header></header>

    <main>
        <div class="glass-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please sign in to manage your hostel stay.</p>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username or Email ID</label>
                    <input type="text" id="username" placeholder="Enter username or email ID" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Sign In</button>
            </form>

            <div class="form-footer" style="margin-top: 25px;">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--glass-border); font-size: 0.8rem; color: var(--text-dim);">
                    <p style="margin-bottom: 5px;">Demo Accounts:</p>
                    <p>Student: <strong>student</strong> / <strong>StudentPassword@123</strong></p>
                    <p>Admin: <strong>admin@example.com</strong> / <strong>AdminPassword@123</strong></p>
                </div>
            </div>
        </div>
    </main>

    <footer></footer>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;

            const result = handleLoginSubmit(usernameInput, passwordInput);
            
            if (result.success) {
                showToast('Welcome back! Logging in...', 'success');
                setTimeout(() => {
                    if (result.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'confirmation.html';
                    }
                }, 1200);
            } else {
                showToast(result.message, 'danger');
            }
            return false;
        }
    </script>
</body>
</html>
