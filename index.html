<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNR Hostels - Hostel Management System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <header></header>

    <main>
        <div class="glass-card wide">
            <h1 style="font-size: 2.5rem; margin-bottom: 15px;">Secure & Comfortable Hostel Living</h1>
            <p class="subtitle" style="font-size: 1.1rem; margin-bottom: 40px;">
                Manage your check-in, check-out, and accommodation services seamlessly at VNRVJIET Hostel.
            </p>

            <div class="dashboard-grid">
                <div class="stat-card primary">
                    <div class="stat-icon">🏢</div>
                    <div class="stat-info">
                        <span class="stat-value" id="totalRoomsVal">--</span>
                        <span class="stat-label">Total Rooms</span>
                    </div>
                </div>
                <div class="stat-card success">
                    <div class="stat-icon">🛏️</div>
                    <div class="stat-info">
                        <span class="stat-value" id="availableBedsVal">--</span>
                        <span class="stat-label">Beds Available</span>
                    </div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-icon">👨‍🎓</div>
                    <div class="stat-info">
                        <span class="stat-value" id="occupiedBedsVal">--</span>
                        <span class="stat-label">Beds Occupied</span>
                    </div>
                </div>
            </div>

            <div style="margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <div id="action-buttons" style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px;">
                    <!-- Dynamically populated buttons -->
                </div>
            </div>
        </div>
    </main>

    <footer></footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Load Stats
            const rooms = getRooms();
            const totalRooms = rooms.length;
            
            let totalCapacity = 0;
            let totalOccupied = 0;
            
            rooms.forEach(r => {
                totalCapacity += r.capacity;
                totalOccupied += r.occupiedCount;
            });
            
            const availableBeds = totalCapacity - totalOccupied;
            
            document.getElementById('totalRoomsVal').innerText = totalRooms;
            document.getElementById('availableBedsVal').innerText = availableBeds;
            document.getElementById('occupiedBedsVal').innerText = totalOccupied;

            // Contextual Buttons
            const user = getLoggedInUser();
            const btnContainer = document.getElementById('action-buttons');
            
            if (user) {
                if (user.role === 'admin') {
                    btnContainer.innerHTML = `
                        <a href="admin.html" class="btn btn-primary">Go to Admin Control Panel</a>
                    `;
                } else {
                    btnContainer.innerHTML = `
                        <a href="confirmation.html" class="btn btn-primary">Go to My Dashboard</a>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%;">
                            <a href="checkin.html" class="btn btn-secondary">Check-In</a>
                            <a href="checkout.html" class="btn btn-secondary">Check-Out</a>
                        </div>
                    `;
                }
            } else {
                btnContainer.innerHTML = `
                    <a href="login.html" class="btn btn-primary">Sign In to Account</a>
                    <p style="text-align:center; color:var(--text-muted); font-size:0.9rem;">
                        New to the hostel? <a href="register.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Create an Account</a>
                    </p>
                `;
            }
        });
    </script>
</body>
</html>
